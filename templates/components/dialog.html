{% macro dialog(title, trigger_text, id) %}
<div x-data="{ open: false }">
  <!-- Trigger -->
  <button @click="open = true" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2">
    {{ trigger_text }}
  </button>

  <!-- Modal overlay and content -->
  <template x-teleport="body">
    <div x-show="open" class="fixed inset-0 z-50 bg-background/80 backdrop-blur-sm flex items-center justify-center" x-transition.opacity>
      <div @click.outside="open = false" class="fixed left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 sm:rounded-lg"
           x-show="open" 
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 scale-95"
           x-transition:enter-end="opacity-100 scale-100"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 scale-100"
           x-transition:leave-end="opacity-0 scale-95">
        <div class="flex flex-col space-y-1.5 text-center sm:text-left">
          <h2 class="text-lg font-semibold leading-none tracking-tight">{{ title }}</h2>
        </div>
        <div>
          {{ caller() }}
        </div>
        <button @click="open = false" class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none">
          <i data-lucide="x" class="h-4 w-4"></i>
          <span class="sr-only">Close</span>
        </button>
      </div>
    </div>
  </template>
</div>
{% endmacro %}
