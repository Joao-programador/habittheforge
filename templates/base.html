<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title | default('Forge - Habit Tracker para Quem Não Recua') }}</title>
    <meta name="description" content="Construa disciplina inabalável. Rastreie hábitos, conquiste streaks e forje a melhor versão de si.">
    <meta name="author" content="Forge" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hind:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js (CDN) for Area Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration and Custom CSS -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT: "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              destructive: {
                DEFAULT: "hsl(var(--destructive))",
                foreground: "hsl(var(--destructive-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              popover: {
                DEFAULT: "hsl(var(--popover))",
                foreground: "hsl(var(--popover-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
            keyframes: {
              "accordion-down": {
                from: { height: "0" },
                to: { height: "var(--radix-accordion-content-height)" },
              },
              "accordion-up": {
                from: { height: "var(--radix-accordion-content-height)" },
                to: { height: "0" },
              },
            },
            animation: {
              "accordion-down": "accordion-down 0.2s ease-out",
              "accordion-up": "accordion-up 0.2s ease-out",
            },
          },
        },
      }
    </script>
    
    <style type="text/tailwindcss">
      @layer base {
        :root {
          --background: 240 60% 6%;
          --foreground: 230 30% 96%;
          --card: 235 50% 11%;
          --card-foreground: 230 30% 96%;
          --popover: 235 50% 13%;
          --popover-foreground: 230 30% 96%;
          --primary: 238 84% 60%;
          --primary-foreground: 230 30% 98%;
          --secondary: 235 40% 18%;
          --secondary-foreground: 230 30% 96%;
          --muted: 235 30% 16%;
          --muted-foreground: 230 15% 65%;
          --accent: 238 84% 60%;
          --accent-foreground: 230 30% 98%;
          --destructive: 0 75% 60%;
          --destructive-foreground: 0 0% 100%;
          --border: 235 30% 20%;
          --input: 235 30% 20%;
          --ring: 238 84% 60%;
          --radius: 1rem;
          --gradient-hero: radial-gradient(ellipse at top, hsl(238 84% 30% / 0.4), transparent 70%);
        }
        
        * {
          @apply border-border;
        }
        html {
          font-family: 'Hind', system-ui, sans-serif;
        }
        body {
          @apply bg-background text-foreground antialiased;
          font-feature-settings: "ss01", "cv11";
          background-image: var(--gradient-hero);
          background-attachment: fixed;
          min-height: 100vh;
        }
        h1, h2, h3, h4, h5, .font-display {
          font-family: 'Archivo Black', system-ui, sans-serif;
          letter-spacing: -0.02em;
          font-weight: 900;
        }
        .font-mono {
          font-family: 'JetBrains Mono', monospace;
        }
      }
      
      @layer components {
        .glass {
          @apply bg-card/60 backdrop-blur-xl border border-border/50;
        }
        .surface-card {
          background: linear-gradient(180deg, hsl(235 50% 13%), hsl(235 50% 9%));
          box-shadow: 0 4px 24px -8px hsl(240 60% 2% / 0.6);
          @apply border border-border/40 rounded-2xl;
        }

        /* Modern subtle dark scrollbar */
        ::-webkit-scrollbar {
          width: 5px;
          height: 5px;
        }
        ::-webkit-scrollbar-track {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          background: hsl(var(--border) / 0.8);
          border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: hsl(var(--primary) / 0.8);
        }

        /* Hide scrollbar completely while allowing scrolling */
        .scrollbar-hide::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
        }
        .scrollbar-hide {
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased" x-data="{ collapsed: false, path: window.location.pathname }">
    <div class="min-h-screen flex w-full">
      <!-- Sidebar -->
      <aside 
        :class="collapsed ? 'w-16' : 'w-64'" 
        class="border-r border-border/60 transition-all duration-300 flex flex-col bg-card/30 sticky top-0 h-screen shrink-0"
      >
        <div class="p-4 flex items-center gap-2.5 h-16 shrink-0">
          <div :class="collapsed ? 'w-9 p-0.5' : 'px-2'" class="h-9 rounded-xl bg-white flex items-center justify-center shadow-sm border border-border/50 shrink-0 overflow-hidden">
            <img src="/static/assets/logo.png" alt="Forge Logo" :class="collapsed ? 'w-full h-full object-contain' : 'h-6 w-auto object-contain'">
          </div>
          <div x-show="!collapsed" class="overflow-hidden whitespace-nowrap transition-all duration-300">
            <div class="font-display text-lg leading-none tracking-tight">FORGE</div>
            <div class="text-[10px] text-muted-foreground uppercase tracking-[0.2em] mt-0.5">
              Discipline · Iron
            </div>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto overflow-x-hidden p-3">
          <nav class="space-y-1">
            <a href="/" :class="path === '/' ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex items-center gap-3 px-2 py-2 rounded-md text-sm font-medium transition-colors w-full">
              <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
              <span x-show="!collapsed" class="whitespace-nowrap">Dashboard</span>
            </a>
            <a href="/habits" :class="path === '/habits' ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex items-center gap-3 px-2 py-2 rounded-md text-sm font-medium transition-colors w-full">
              <i data-lucide="flame" class="w-4 h-4 shrink-0"></i>
              <span x-show="!collapsed" class="whitespace-nowrap">Hábitos</span>
            </a>
            <a href="/planner" :class="path === '/planner' ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex items-center gap-3 px-2 py-2 rounded-md text-sm font-medium transition-colors w-full">
              <i data-lucide="calendar-range" class="w-4 h-4 shrink-0"></i>
              <span x-show="!collapsed" class="whitespace-nowrap">Planner</span>
            </a>
            <a href="/todos" :class="path === '/todos' ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex items-center gap-3 px-2 py-2 rounded-md text-sm font-medium transition-colors w-full">
              <i data-lucide="list-checks" class="w-4 h-4 shrink-0"></i>
              <span x-show="!collapsed" class="whitespace-nowrap">To-Do</span>
            </a>
            <a href="/journal" :class="path === '/journal' ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex items-center gap-3 px-2 py-2 rounded-md text-sm font-medium transition-colors w-full">
              <i data-lucide="book-open" class="w-4 h-4 shrink-0"></i>
              <span x-show="!collapsed" class="whitespace-nowrap">Diário</span>
            </a>
            <a href="/achievements" :class="path === '/achievements' ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex items-center gap-3 px-2 py-2 rounded-md text-sm font-medium transition-colors w-full">
              <i data-lucide="trophy" class="w-4 h-4 shrink-0"></i>
              <span x-show="!collapsed" class="whitespace-nowrap">Conquistas</span>
            </a>
            <a href="/settings" :class="path === '/settings' ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex items-center gap-3 px-2 py-2 rounded-md text-sm font-medium transition-colors w-full">
              <i data-lucide="settings" class="w-4 h-4 shrink-0"></i>
              <span x-show="!collapsed" class="whitespace-nowrap">Configurações</span>
            </a>
          </nav>
        </div>
        
        <div class="p-3">
          <div x-show="!collapsed" class="px-2 py-1 text-[10px] text-muted-foreground italic leading-snug">
            Dados salvos localmente neste navegador.
          </div>
        </div>
      </aside>

      <!-- Mascote Flutuante da Forja (Canto Inferior Direito) -->
      <div 
        x-data="{ minimized: false }"
        class="fixed bottom-5 right-5 z-50 select-none"
      >
        <!-- Minimizado -->
        <button 
          x-show="minimized" 
          @click="minimized = false"
          class="flex items-center gap-2.5 p-1.5 pr-3.5 rounded-full glass backdrop-blur-xl bg-card/90 border-2 border-border/70 shadow-2xl hover:scale-105 transition-transform"
          style="display: none;"
          title="Expandir Mascote da Forja"
        >
          <div class="w-10 h-10 rounded-full bg-white overflow-hidden border-2 border-white/60 shadow-sm flex items-center justify-center shrink-0">
            <img src="/assets/wojaks/doomer.png" alt="Wojak" class="w-full h-full object-cover scale-155 object-[center_20%]">
          </div>
          <span class="font-display text-xs font-bold text-foreground">Doomer</span>
          <span class="font-mono text-[10px] px-2 py-0.5 rounded-full font-bold uppercase bg-zinc-800 text-zinc-300">9%</span>
          <i data-lucide="chevron-up" class="w-3.5 h-3.5 text-muted-foreground"></i>
        </button>

        <!-- Expandido -->
        <div 
          x-show="!minimized"
          class="flex flex-col items-end gap-2.5 max-w-[320px]"
        >
          <!-- Balão de Fala HQ -->
          <div class="relative p-3.5 rounded-2xl glass backdrop-blur-2xl bg-card/95 border-2 border-border/70 shadow-2xl text-left">
            <div class="flex items-center justify-between gap-2 pb-2 mb-2 border-b border-border/30">
              <span class="text-[10px] uppercase font-mono font-bold tracking-wider text-muted-foreground">
                Companheiro da Forja
              </span>
              <button @click="minimized = true" class="p-1 rounded hover:bg-secondary text-muted-foreground hover:text-foreground transition-colors" title="Minimizar">
                <i data-lucide="minus" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            <p class="text-xs text-foreground/90 italic leading-relaxed">
              "It's over pro beto. Cada hábito concluído é um passo rumo à redenção."
            </p>
            <div class="absolute -bottom-2 right-8 w-4 h-4 rotate-45 bg-card/95 border-r-2 border-b-2 border-border/70"></div>
          </div>

          <!-- Base: Avatar de 88px -->
          <div class="flex items-center gap-3 pr-2">
            <div class="text-right">
              <div class="font-display text-sm font-bold tracking-tight text-foreground">
                Withered Doomer
              </div>
              <span class="font-mono text-[10px] px-2 py-0.5 rounded-full font-bold uppercase bg-zinc-800 text-zinc-300 border border-zinc-700">
                9% hoje
              </span>
            </div>
            <div class="w-[88px] h-[88px] rounded-2xl bg-white overflow-hidden shrink-0 border-2 border-white/50 shadow-2xl flex items-center justify-center hover:scale-105 transition-transform">
              <img src="/assets/wojaks/doomer.png" alt="Wojak" class="w-full h-full object-cover scale-155 object-[center_20%]">
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content Wrapper -->
      <div class="flex-1 flex flex-col min-w-0">
        <!-- Header / Sidebar Trigger -->
        <header class="h-14 border-b border-border/40 flex items-center px-3 sticky top-0 z-30 bg-background/70 backdrop-blur-xl">
          <button @click="collapsed = !collapsed" class="p-2 rounded-md hover:bg-muted text-muted-foreground hover:text-foreground transition-colors" title="Toggle Sidebar">
            <i data-lucide="panel-left" class="w-5 h-5"></i>
          </button>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 p-4 md:p-6 lg:p-8 max-w-[1480px] w-full mx-auto">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
      lucide.createIcons();
      document.body.addEventListener('htmx:afterSwap', function() {
        lucide.createIcons();
      });
    </script>
  </body>
</html>
