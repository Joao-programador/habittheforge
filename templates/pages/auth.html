{% extends "base_auth.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md surface-card p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-display text-gradient mb-2">Forge</h1>
      <p class="text-muted-foreground">Autentique-se para continuar.</p>
    </div>
    
    <form class="space-y-4" hx-post="/login" hx-swap="outerHTML">
      <div>
        <label class="block text-sm font-medium mb-1">E-mail</label>
        <input name="email" type="email" required class="w-full bg-input border border-border rounded-md px-3 py-2 text-foreground focus:outline-none focus:ring-2 focus:ring-primary" placeholder="seu@email.com">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Senha</label>
        <input name="password" type="password" required class="w-full bg-input border border-border rounded-md px-3 py-2 text-foreground focus:outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••">
      </div>
      
      <button type="submit" class="w-full bg-primary text-primary-foreground py-2 rounded-md font-medium hover:opacity-90 transition-opacity">
        Entrar
      </button>
      <div id="auth-error" class="text-destructive text-sm text-center mt-2"></div>
    </form>
  </div>
</div>
{% endblock %}
