{% extends "base.html" %}

{% block content %}
<div x-data="workflowsApp()" class="max-w-5xl space-y-6">
  <div>
    <h1 class="font-display text-4xl tracking-tight uppercase">
      Algoritmos
    </h1>
    <p class="text-muted-foreground mt-1">
      Templates passo-a-passo. Blindagem contra distração.
    </p>
  </div>

  <!-- Big forge button -->
  <button
    @click="openNew()"
    class="group w-full surface-card p-6 sm:p-8 flex items-center gap-4 sm:gap-6 hover:border-primary/60 hover:glow-primary transition-all duration-300 text-left"
  >
    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-primary flex items-center justify-center glow-primary shrink-0 group-hover:scale-110 transition-transform duration-300">
      <i data-lucide="hammer" class="w-7 h-7 sm:w-8 sm:h-8 text-primary-foreground" stroke-width="2.5"></i>
    </div>
    <div class="flex-1 min-w-0">
      <div class="font-display text-xl sm:text-2xl tracking-tight uppercase">
        Forjar Novo Algoritmo
      </div>
      <div class="text-sm text-muted-foreground mt-0.5">
        Construa um workflow de passos para uma rotina.
      </div>
    </div>
    <i data-lucide="plus" class="w-6 h-6 text-primary opacity-70 group-hover:opacity-100 shrink-0"></i>
  </button>

  <!-- Grid -->
  <template x-if="workflows.length === 0">
    <div class="surface-card p-12 text-center">
      <i data-lucide="workflow" class="w-10 h-10 text-muted-foreground mx-auto mb-3"></i>
      <p class="text-muted-foreground">
        Nenhum algoritmo ainda. Forje o primeiro.
      </p>
    </div>
  </template>

  <template x-if="workflows.length > 0">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-for="wf in workflows" :key="wf.id">
        <div class="surface-card p-5 flex flex-col gap-4 hover:border-primary/40 transition-colors group">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="font-display text-lg tracking-tight uppercase line-clamp-2" x-text="wf.title"></h3>
              <div class="flex items-center gap-1.5 mt-1 text-xs text-muted-foreground">
                <i data-lucide="list-ordered" class="w-3.5 h-3.5"></i>
                <span x-text="`${wf.steps.length} ${wf.steps.length === 1 ? 'passo' : 'passos'}`"></span>
              </div>
            </div>
            
            <!-- Alert Dialog for Delete -->
            <div x-data="{ openDelete: false }" class="relative">
              <button
                @click="openDelete = true"
                class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-destructive h-10 w-10 text-muted-foreground shrink-0 opacity-0 group-hover:opacity-100 transition-opacity"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
              
              <!-- AlertDialogContent -->
              <div x-show="openDelete" class="fixed inset-0 z-50 bg-black/80 data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0" style="display: none;"></div>
              <div x-show="openDelete" class="fixed left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 sm:rounded-lg" style="display: none;">
                <div class="flex flex-col space-y-2 text-center sm:text-left">
                  <h2 class="text-lg font-semibold">Apagar algoritmo?</h2>
                  <p class="text-sm text-muted-foreground">
                    "<span x-text="wf.title"></span>" será removido. Essa ação é permanente.
                  </p>
                </div>
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
                  <button @click="openDelete = false" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 mt-2 sm:mt-0">Cancelar</button>
                  <button @click="deleteWorkflow(wf.id); openDelete = false" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-destructive text-destructive-foreground hover:bg-destructive/90 h-10 px-4 py-2">Apagar</button>
                </div>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 mt-auto">
            <button
              @click="setPreviewing(wf)"
              title="Visualizar"
              class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 w-10"
            >
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
            <button
              @click="openEdit(wf)"
              class="inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-9 px-3 text-xs gap-1.5"
            >
              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              Editar
            </button>
            <button
              @click="setRunning(wf)"
              class="inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-3 text-xs gap-1.5 ml-auto glow-primary"
            >
              <i data-lucide="play" class="w-3.5 h-3.5" fill="currentColor"></i>
              Executar
            </button>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- Workflow Builder Dialog -->
  <div x-show="builderOpen" class="relative z-50" style="display: none;" x-cloak>
    <div x-show="builderOpen" x-transition.opacity class="fixed inset-0 bg-black/80"></div>
    <div x-show="builderOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="w-full max-w-2xl max-h-[90vh] overflow-y-auto border bg-background p-6 shadow-lg sm:rounded-lg">
        <div class="flex flex-col space-y-1.5 text-center sm:text-left mb-5">
          <h2 class="font-display text-2xl tracking-tight uppercase flex items-center gap-2">
            <i data-lucide="hammer" class="w-5 h-5 text-primary"></i>
            <span x-text="editing ? 'Forjar Algoritmo' : 'Novo Algoritmo'"></span>
          </h2>
        </div>

        <div class="space-y-5 py-2">
          <div class="space-y-2">
            <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Título do Algoritmo</label>
            <input type="text" x-model="builderData.title" placeholder="Ex: Algoritmo de Estudos" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" />
          </div>

          <div>
            <label class="text-xs uppercase tracking-widest text-muted-foreground">
              Passos · <span x-text="builderData.steps.length"></span>
            </label>

            <div class="mt-3 space-y-3 relative">
              <template x-for="(step, idx) in builderData.steps" :key="step._id">
                <div class="relative">
                  <!-- connecting line -->
                  <template x-if="idx < builderData.steps.length - 1">
                    <div aria-hidden class="absolute left-[18px] top-full h-3 w-0.5 bg-gradient-to-b from-primary/60 to-transparent"></div>
                  </template>

                  <div class="surface-card p-3 sm:p-4 flex gap-3 items-start">
                    <div class="flex flex-col items-center pt-1.5 shrink-0">
                      <div class="w-9 h-9 rounded-xl bg-gradient-primary flex items-center justify-center font-display text-sm text-primary-foreground glow-primary" x-text="idx + 1"></div>
                    </div>

                    <div class="flex-1 min-w-0 space-y-2">
                      <div class="flex items-center gap-2">
                        <input type="text" x-model="step.title" :placeholder="`Passo ${idx + 1}`" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 font-medium" />
                        <button type="button" @click="removeStep(idx)" :disabled="builderData.steps.length === 1" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-destructive h-10 w-10 text-muted-foreground shrink-0">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>

                      <div x-data="{ expanded: false }" class="w-full">
                        <div class="border-0 border-b">
                          <button type="button" @click="expanded = !expanded" class="flex flex-1 items-center justify-between py-1.5 text-xs uppercase tracking-widest text-muted-foreground hover:text-foreground transition-all hover:no-underline w-full text-left font-medium">
                            Adicionar Detalhes
                            <i data-lucide="chevron-down" class="h-4 w-4 shrink-0 transition-transform duration-200" :class="expanded ? 'rotate-180' : ''"></i>
                          </button>
                        </div>
                        <div x-show="expanded" x-collapse>
                          <div class="pt-2 space-y-3 pb-2">
                            <div class="space-y-1.5">
                              <label class="text-xs font-medium leading-none">Avisos / Notas (o que não fazer, como fazer)</label>
                              <textarea x-model="step.notes" placeholder="Sem celular. Foco total no caderno." rows="3" class="flex min-h-[80px] w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"></textarea>
                            </div>
                            <div class="space-y-1.5">
                              <label class="text-xs font-medium leading-none">Tempo estimado (minutos)</label>
                              <input type="number" min="0" x-model.number="step.estimatedMinutes" placeholder="25" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 max-w-[120px]" />
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>

            <button type="button" @click="addStep()" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4 py-2 w-full mt-4 gap-2 border border-dashed border-border/60">
              <i data-lucide="plus" class="w-4 h-4"></i> Adicionar novo passo
            </button>
          </div>
        </div>

        <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2 mt-4">
          <button @click="builderOpen = false" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 mt-2 sm:mt-0">
            Cancelar
          </button>
          <button @click="handleSaveBuilder()" :disabled="!isBuilderValid()" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 gap-2">
            <i data-lucide="hammer" class="w-4 h-4"></i>
            Salvar Template
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Workflow Runner -->
  <div x-show="runnerOpen" class="fixed inset-0 z-[100] bg-background/95 backdrop-blur-xl overflow-y-auto" style="display: none;" x-cloak>
    <div class="min-h-full flex flex-col" x-show="running" x-transition>
      <!-- Header -->
      <div class="sticky top-0 z-10 bg-background/80 backdrop-blur-xl border-b border-border/40">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-4">
          <div class="flex items-center justify-between gap-4">
            <div class="min-w-0">
              <div class="text-[10px] uppercase tracking-[0.25em] text-primary/80">Executando</div>
              <h1 class="font-display text-xl sm:text-2xl tracking-tight uppercase truncate" x-text="running?.title"></h1>
            </div>
            <button @click="closeRunner()" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 w-10 shrink-0" aria-label="Fechar">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Progress -->
          <div class="mt-4">
            <div class="flex items-center justify-between text-xs text-muted-foreground mb-1.5">
              <span class="uppercase tracking-widest">Progresso</span>
              <span class="font-mono" x-text="`${runnerDone}/${runnerTotal} · ${Math.round(runnerProgress)}%`"></span>
            </div>
            <div class="h-2.5 w-full rounded-full bg-secondary/40 overflow-hidden relative">
              <div class="h-full rounded-full bg-gradient-primary glow-primary transition-all duration-300 ease-out" :style="`width: ${runnerProgress}%`"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Steps -->
      <div class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-6 space-y-3">
        <template x-for="(step, idx) in running?.steps" :key="step.id">
          <button type="button" @click="toggleStep(step.id)" class="w-full text-left surface-card p-4 sm:p-5 flex gap-4 items-start transition-all duration-300 hover:border-primary/40" :class="runnerChecked[step.id] ? 'opacity-60' : ''">
            <!-- Custom big checkbox -->
            <div class="shrink-0 w-9 h-9 sm:w-11 sm:h-11 rounded-xl border-2 flex items-center justify-center transition-all duration-300" :class="runnerChecked[step.id] ? 'bg-gradient-primary border-transparent glow-primary' : 'border-border bg-secondary/30 hover:border-primary/60'">
              <div x-show="runnerChecked[step.id]" x-transition.scale.origin.bottom>
                <i data-lucide="check" class="w-5 h-5 sm:w-6 sm:h-6 text-primary-foreground" stroke-width="3"></i>
              </div>
            </div>

            <div class="flex-1 min-w-0">
              <div class="flex items-start gap-2">
                <span class="font-mono text-xs text-muted-foreground pt-0.5" x-text="String(idx + 1).padStart(2, '0')"></span>
                <h3 class="font-display text-base sm:text-lg tracking-tight transition-all duration-300" :class="runnerChecked[step.id] ? 'line-through text-muted-foreground' : ''" x-text="step.title"></h3>
              </div>
              <template x-if="step.notes || step.estimatedMinutes">
                <div class="mt-1.5 pl-7 space-y-1 transition-opacity duration-300" :class="runnerChecked[step.id] ? 'opacity-70' : ''">
                  <template x-if="step.notes">
                    <p class="text-xs sm:text-sm italic text-muted-foreground whitespace-pre-wrap" x-text="step.notes"></p>
                  </template>
                  <template x-if="step.estimatedMinutes">
                    <div class="flex items-center gap-1 text-[11px] italic text-muted-foreground">
                      <i data-lucide="clock" class="w-3 h-3"></i>
                      <span x-text="`~${step.estimatedMinutes} min`"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </button>
        </template>
      </div>
    </div>

    <!-- Forged success overlay -->
    <div x-show="runnerForged" x-transition.opacity class="absolute inset-0 z-20 flex items-center justify-center bg-background/70 backdrop-blur-md pointer-events-none" style="display: none;">
      <div x-show="runnerForged" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 scale-50 -rotate-12" x-transition:enter-end="opacity-100 scale-100 rotate-0" class="text-center">
        <div class="relative inline-flex items-center justify-center">
          <div class="absolute inset-0 rounded-full bg-gradient-primary blur-3xl opacity-60 animate-pulse-glow"></div>
          <div class="relative w-28 h-28 rounded-full bg-gradient-primary flex items-center justify-center glow-primary">
            <i data-lucide="sparkles" class="w-14 h-14 text-primary-foreground" stroke-width="2.5"></i>
          </div>
        </div>
        <div class="mt-6 font-display text-4xl tracking-tight uppercase text-gradient">
          Forjado
        </div>
        <div class="text-xs uppercase tracking-[0.3em] text-muted-foreground mt-2">
          Algoritmo Completo
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.13.3/dist/cdn.min.js" defer></script>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('workflowsApp', () => ({
    workflows: [],
    builderOpen: false,
    editing: null,
    running: null,
    previewing: null,

    // Builder state
    builderData: {
      title: '',
      steps: []
    },

    // Runner state
    runnerOpen: false,
    runnerChecked: {},
    runnerForged: false,
    runnerTimer: null,

    get runnerTotal() {
      return this.running?.steps?.length || 0;
    },
    get runnerDone() {
      if (!this.running) return 0;
      return this.running.steps.filter(s => this.runnerChecked[s.id]).length;
    },
    get runnerProgress() {
      if (this.runnerTotal === 0) return 0;
      return (this.runnerDone / this.runnerTotal) * 100;
    },

    init() {
      const stored = localStorage.getItem('habit-forge-workflows');
      if (stored) {
        try {
          this.workflows = JSON.parse(stored);
        } catch(e) {}
      }
      this.$watch('workflows', () => {
        this.$nextTick(() => {
          if (typeof lucide !== 'undefined') lucide.createIcons();
        });
      });
      this.$watch('builderOpen', () => {
        this.$nextTick(() => {
          if (typeof lucide !== 'undefined') lucide.createIcons();
        });
      });
      this.$watch('runnerOpen', () => {
        this.$nextTick(() => {
          if (typeof lucide !== 'undefined') lucide.createIcons();
        });
      });
    },
    saveWorkflows() {
      localStorage.setItem('habit-forge-workflows', JSON.stringify(this.workflows));
    },
    
    // Builder logic
    openNew() {
      this.editing = null;
      this.builderData = {
        title: '',
        steps: [this.createStep()]
      };
      this.builderOpen = true;
    },
    openEdit(wf) {
      this.editing = wf;
      this.builderData = {
        title: wf.title,
        steps: wf.steps.map(s => ({...s, _id: s.id || crypto.randomUUID()})) // Ensure _id exists for reactivity
      };
      this.builderOpen = true;
    },
    createStep() {
      return { _id: crypto.randomUUID(), id: crypto.randomUUID(), title: '', notes: '', estimatedMinutes: null };
    },
    addStep() {
      this.builderData.steps.push(this.createStep());
    },
    removeStep(idx) {
      if (this.builderData.steps.length > 1) {
        this.builderData.steps.splice(idx, 1);
      }
    },
    isBuilderValid() {
      const titleValid = this.builderData.title.trim().length > 0;
      const stepsValid = this.builderData.steps.some(s => s.title.trim().length > 0);
      return titleValid && stepsValid;
    },
    handleSaveBuilder() {
      if (!this.isBuilderValid()) return;

      const cleanedSteps = this.builderData.steps
        .map(s => ({ id: s.id || crypto.randomUUID(), title: s.title.trim(), notes: s.notes, estimatedMinutes: s.estimatedMinutes }))
        .filter(s => s.title.length > 0);

      if (this.editing) {
        const idx = this.workflows.findIndex(w => w.id === this.editing.id);
        if (idx !== -1) {
          this.workflows[idx].title = this.builderData.title.trim();
          this.workflows[idx].steps = cleanedSteps;
        }
      } else {
        this.workflows.push({
          id: crypto.randomUUID(),
          title: this.builderData.title.trim(),
          steps: cleanedSteps,
          createdAt: new Date().toISOString()
        });
      }
      this.saveWorkflows();
      this.builderOpen = false;
    },

    deleteWorkflow(id) {
      this.workflows = this.workflows.filter(w => w.id !== id);
      this.saveWorkflows();
    },
    setPreviewing(wf) {
      this.previewing = wf;
    },
    
    // Runner logic
    setRunning(wf) {
      this.running = wf;
      this.runnerChecked = {};
      this.runnerForged = false;
      this.runnerOpen = true;
      if (this.runnerTimer) clearTimeout(this.runnerTimer);
    },
    toggleStep(id) {
      this.runnerChecked[id] = !this.runnerChecked[id];
      if (this.runnerDone === this.runnerTotal && this.runnerTotal > 0 && !this.runnerForged) {
        this.runnerForged = true;
        this.runnerTimer = setTimeout(() => {
          this.closeRunner();
        }, 1500);
      }
    },
    closeRunner() {
      this.runnerOpen = false;
      setTimeout(() => {
        this.running = null;
      }, 250);
    }
  }));
});
</script>
{% endblock %}
