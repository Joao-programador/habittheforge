{% extends "base.html" %}

{% block content %}
<div x-data="dailyCockpitData()" x-init="init()">
    <div class="space-y-5">
        
        <!-- Wojak / Motivational Banner -->
        <div class="relative overflow-hidden surface-card p-5 md:p-6 shadow-sm border border-primary/20">
          <div class="absolute inset-0 opacity-20 bg-gradient-to-r from-primary/30 to-purple-500/10 pointer-events-none"></div>
          <div class="relative flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-2xl bg-gradient-primary flex items-center justify-center glow-primary shrink-0 text-2xl shadow-lg">
                <span x-text="stageEmoji"></span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h2 class="font-display text-lg md:text-xl tracking-tight" x-text="stageTitle"></h2>
                  <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-primary/20 text-primary border border-primary/30 uppercase tracking-widest font-semibold" x-text="`${dailyCompletionPct}% HOJE`"></span>
                </div>
                <p class="text-xs text-muted-foreground mt-0.5 italic max-w-xl" x-text="`&quot;${currentPhrase}&quot;`"></p>
              </div>
            </div>

            <button type="button" @click="shufflePhrase()" class="text-xs font-mono px-3 py-1.5 rounded-lg border border-border/50 bg-secondary/50 hover:bg-secondary text-muted-foreground hover:text-foreground transition-all shrink-0">
              🎲 Trocar frase
            </button>
          </div>
        </div>

        <!-- Barra de Seleção de Dia do Cockpit -->
        <div class="surface-card p-3 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <button @click="prevDay()" class="inline-flex items-center justify-center h-8 w-8 rounded-md border border-input bg-background hover:bg-accent hover:text-accent-foreground" title="Dia anterior">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div class="px-2 min-w-[170px] text-center">
              <span class="font-display text-sm tracking-tight capitalize block" x-text="selectedDateFormatted"></span>
              <span class="text-[10px] font-mono text-muted-foreground block" x-text="isCurrentToday ? 'Hoje' : selectedDateYear"></span>
            </div>
            <button @click="nextDay()" class="inline-flex items-center justify-center h-8 w-8 rounded-md border border-input bg-background hover:bg-accent hover:text-accent-foreground" title="Próximo dia">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
            <button x-show="!isCurrentToday" @click="goToToday()" class="ml-1 inline-flex items-center justify-center h-8 px-2.5 rounded-md text-xs font-mono font-medium hover:bg-accent hover:text-accent-foreground gap-1">
              <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i> Voltar para Hoje
            </button>
          </div>

          <div class="text-xs text-muted-foreground font-mono px-2 hidden sm:block">
            Cockpit Diário · Foco no Presente
          </div>
        </div>

        <!-- Bento Grid Diário -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          
          <!-- Coluna Esquerda: Hábitos de Hoje (7 colunas) -->
          <div class="lg:col-span-7 surface-card p-5 sm:p-6 flex flex-col justify-between space-y-4">
            <div>
              <div class="flex items-center justify-between gap-3 mb-2">
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 rounded-lg bg-primary/15 text-primary flex items-center justify-center">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h2 class="font-display text-lg tracking-tight">Hábitos de Hoje</h2>
                    <p class="text-xs text-muted-foreground capitalize" x-text="selectedDateFormatted"></p>
                  </div>
                </div>
                <span class="font-mono text-xs px-2.5 py-1 rounded-md bg-secondary border border-border/40 font-semibold" x-text="`${completedTodayCount} / ${habits.length} feitos`"></span>
              </div>

              <!-- Barra de Progresso Rápida -->
              <div class="w-full bg-secondary/50 rounded-full h-2 overflow-hidden border border-border/30 mt-3">
                <div class="bg-gradient-primary h-full transition-all duration-500 rounded-full" :style="`width: ${dailyCompletionPct}%`"></div>
              </div>
            </div>

            <!-- Lista de Hábitos -->
            <div class="space-y-2.5 flex-1 min-h-[200px]">
              <template x-if="habits.length === 0">
                <div class="py-12 text-center text-muted-foreground space-y-3">
                  <div class="text-4xl">🔥</div>
                  <p class="text-sm">Nenhum hábito cadastrado ainda.</p>
                  <a href="/habits" class="inline-flex items-center gap-1.5 text-xs text-primary font-medium hover:underline">
                    Forjar primeiro hábito na Matriz ➔
                  </a>
                </div>
              </template>

              <template x-for="habit in habits" :key="habit.id">
                <div :class="isHabitDone(habit.id) ? 'bg-secondary/40 border-border/50 text-muted-foreground' : 'bg-surface border-border/40 hover:border-primary/40 hover:bg-surface-elevated text-foreground'" class="p-3.5 rounded-xl border transition-all flex items-center justify-between gap-3 group select-none">
                  <div class="flex items-center gap-3 min-w-0">
                    <button type="button" @click="toggleHabitToday(habit.id)" :style="isHabitDone(habit.id) ? `border-color: ${habit.color}; box-shadow: 0 0 14px ${habit.color}35` : ''" :class="isHabitDone(habit.id) ? 'bg-primary/20 text-primary border border-primary/40' : 'bg-secondary/60 hover:bg-secondary border border-border/50'" class="w-9 h-9 rounded-xl flex items-center justify-center text-lg shrink-0 transition-transform active:scale-95 cursor-pointer">
                      <template x-if="isHabitDone(habit.id)">
                        <i data-lucide="check" class="w-5 h-5 text-white stroke-[3]"></i>
                      </template>
                      <template x-if="!isHabitDone(habit.id)">
                        <span x-text="habit.emoji"></span>
                      </template>
                    </button>
                    <div class="min-w-0">
                      <div :class="isHabitDone(habit.id) ? 'line-through opacity-70' : ''" class="font-medium text-sm truncate" x-text="habit.name"></div>
                      <div class="flex items-center gap-2 mt-0.5">
                        <span class="text-[11px] font-mono text-muted-foreground flex items-center gap-1">
                          <i data-lucide="flame" class="w-3 h-3 text-orange-400"></i>
                          <span x-text="`${getStreak(habit.id)}d streak`"></span>
                        </span>
                      </div>
                    </div>
                  </div>

                  <button type="button" @click="toggleHabitToday(habit.id)" :class="isHabitDone(habit.id) ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-secondary/60 text-foreground hover:bg-primary hover:text-primary-foreground border-border/40'" class="text-xs px-3 py-1.5 rounded-lg border font-medium transition-all shrink-0 cursor-pointer" x-text="isHabitDone(habit.id) ? 'Feito' : 'Marcar'"></button>
                </div>
              </template>
            </div>

            <!-- Footer -->
            <div class="pt-3 border-t border-border/30 flex items-center justify-between">
              <a href="/habits" class="text-xs text-muted-foreground hover:text-foreground font-mono">
                Gerenciar hábitos
              </a>
              <a href="/habits" class="inline-flex items-center gap-1.5 text-xs text-primary font-medium hover:underline transition-colors">
                <span>Ver Matriz de 31 Dias</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </div>

          <!-- Coluna Direita: To-Dos e Diário (5 colunas) -->
          <div class="lg:col-span-5 space-y-5">
            
            <!-- To-Do do Dia -->
            <div class="surface-card p-5 sm:p-6 flex flex-col justify-between space-y-4">
              <div>
                <div class="flex items-center justify-between gap-3 mb-2">
                  <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/15 text-indigo-400 flex items-center justify-center">
                      <i data-lucide="list-checks" class="w-4 h-4"></i>
                    </div>
                    <div>
                      <h2 class="font-display text-lg tracking-tight">To-Do do Dia</h2>
                      <p class="text-xs text-muted-foreground capitalize" x-text="selectedDateFormatted"></p>
                    </div>
                  </div>
                  <span class="font-mono text-xs px-2 py-0.5 rounded-md bg-secondary border border-border/40 text-muted-foreground" x-text="`${dayTodosPending} pendentes`"></span>
                </div>

                <form @submit.prevent="addQuickTodo()" class="flex items-center gap-2 mt-3">
                  <input type="text" x-model="quickTodoTitle" placeholder="Nova missão para hoje..." class="h-9 text-xs bg-surface border border-border/40 rounded-md px-3 flex-1 focus:outline-none focus:border-indigo-500">
                  <button type="submit" :disabled="!quickTodoTitle.trim()" class="h-9 px-3 gap-1 shrink-0 bg-indigo-600 hover:bg-indigo-500 text-white rounded-md text-xs font-medium inline-flex items-center disabled:opacity-50">
                    <i data-lucide="plus" class="w-4 h-4"></i> Adicionar
                  </button>
                </form>
              </div>

              <div class="space-y-2 flex-1 min-h-[120px] max-h-[200px] overflow-y-auto pr-1">
                <template x-if="dayTodos.length === 0">
                  <div class="py-6 text-center text-muted-foreground text-xs">
                    Nenhuma tarefa agendada para este dia.
                  </div>
                </template>
                <template x-for="t in dayTodos" :key="t.id">
                  <div :class="t.completed ? 'bg-secondary/30 border-border/40 text-muted-foreground' : 'bg-surface border-border/40 hover:border-indigo-500/40 text-foreground'" class="p-2.5 rounded-lg border transition-all flex items-center justify-between gap-3 text-xs">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <button type="button" @click="toggleTodoItem(t.id)" :class="t.completed ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'border border-border/60 bg-secondary/40'" class="w-5 h-5 rounded-md flex items-center justify-center transition-colors cursor-pointer shrink-0">
                        <template x-if="t.completed">
                          <i data-lucide="check" class="w-3.5 h-3.5"></i>
                        </template>
                      </button>
                      <span :class="t.completed ? 'line-through opacity-70' : ''" class="truncate font-medium" x-text="t.title"></span>
                    </div>
                  </div>
                </template>
              </div>

              <div class="pt-2 border-t border-border/30 flex items-center justify-between text-xs">
                <span class="text-[11px] text-muted-foreground font-mono" x-text="`${dayTodosCompleted} concluídas`"></span>
                <a href="/todos" class="inline-flex items-center gap-1.5 text-indigo-400 hover:text-indigo-300 font-medium hover:underline transition-colors">
                  <span>Abrir quadro completo</span>
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </a>
              </div>
            </div>

            <!-- Diário de Bordo Rápido -->
            <div class="surface-card p-5 sm:p-6 flex flex-col justify-between space-y-4">
              <div>
                <div class="flex items-center justify-between gap-3 mb-2">
                  <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-amber-500/15 text-amber-400 flex items-center justify-center">
                      <i data-lucide="book-open" class="w-4 h-4"></i>
                    </div>
                    <div>
                      <h2 class="font-display text-lg tracking-tight">Diário de Bordo</h2>
                      <p class="text-xs text-muted-foreground capitalize" x-text="selectedDateFormatted"></p>
                    </div>
                  </div>
                  <span class="font-mono text-xs px-2 py-0.5 rounded-md bg-secondary border border-border/40 text-muted-foreground" x-text="`${dailyCompletionPct}% disciplina`"></span>
                </div>
              </div>

              <div class="space-y-3 flex-1">
                <div>
                  <label class="text-[11px] font-mono text-muted-foreground flex items-center gap-1.5 mb-1">
                    <i data-lucide="trophy" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span>Vitória do Dia</span>
                  </label>
                  <input type="text" x-model="journalWin" placeholder="Ex: Treinei em jejum e li 15 páginas" class="w-full h-8 text-xs bg-surface border border-border/40 rounded-md px-2.5 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                  <label class="text-[11px] font-mono text-muted-foreground flex items-center gap-1.5 mb-1">
                    <i data-lucide="skull" class="w-3.5 h-3.5 text-red-400"></i>
                    <span>Desculpa de Beto Enfrentada</span>
                  </label>
                  <input type="text" x-model="journalExcuse" placeholder="Ex: 'Estou cansado, amanhã eu faço'" class="w-full h-8 text-xs bg-surface border border-border/40 rounded-md px-2.5 focus:outline-none focus:border-red-500">
                </div>

                <div>
                  <label class="text-[11px] font-mono text-muted-foreground flex items-center gap-1.5 mb-1">
                    <i data-lucide="book-open" class="w-3.5 h-3.5 text-indigo-400"></i>
                    <span>Reflexão Rápida</span>
                  </label>
                  <textarea x-model="journalContent" rows="2" placeholder="Como foi o combate pela sua mente hoje? Registre..." class="w-full text-xs resize-none bg-surface border border-border/40 rounded-md p-2 focus:outline-none focus:border-primary min-h-[50px]"></textarea>
                </div>
              </div>

              <div class="pt-2 border-t border-border/30 flex items-center justify-between text-xs gap-3">
                <button type="button" @click="saveDailyJournal()" :class="journalSaved ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-primary hover:bg-primary/90'" class="h-8 px-3 rounded-md text-primary-foreground font-medium transition-all text-xs inline-flex items-center gap-1.5">
                  <template x-if="journalSaved">
                    <span class="inline-flex items-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i> Gravado</span>
                  </template>
                  <template x-if="!journalSaved">
                    <span class="inline-flex items-center gap-1"><i data-lucide="save" class="w-3.5 h-3.5"></i> Salvar Registro</span>
                  </template>
                </button>

                <a href="/journal" class="inline-flex items-center gap-1.5 text-amber-400 hover:text-amber-300 font-medium hover:underline transition-colors text-xs">
                  <span>Ver histórico completo</span>
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </a>
              </div>
            </div>

          </div>

        </div>

    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('dailyCockpitData', () => ({
    currentDate: new Date(),
    habits: {{ habits_json | tojson | safe }},
    completions: {},
    todos: [],
    quickTodoTitle: '',
    journalWin: '',
    journalExcuse: '',
    journalContent: '',
    journalSaved: false,
    phraseIndex: 0,
    phrases: [
      "O ferro não se importa com seus sentimentos. Erga o peso da disciplina.",
      "Hoje é o dia de moggar a procrastinação e deixar o beto no passado.",
      "Cada repetição sem reclamar é um prego no caixão da mediocridade.",
      "Consistência silenciosa gera resultados ensurdecedores."
    ],

    get currentPhrase() {
      return this.phrases[this.phraseIndex % this.phrases.length];
    },
    shufflePhrase() {
      this.phraseIndex = (this.phraseIndex + 1) % this.phrases.length;
    },

    get isCurrentToday() {
      const today = new Date();
      return this.currentDate.toDateString() === today.toDateString();
    },
    get selectedDateStr() {
      const y = this.currentDate.getFullYear();
      const m = String(this.currentDate.getMonth() + 1).padStart(2, '0');
      const d = String(this.currentDate.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    },
    get selectedDateFormatted() {
      return this.currentDate.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
    },
    get selectedDateYear() {
      return this.currentDate.getFullYear().toString();
    },

    get completedTodayCount() {
      if (!this.habits.length) return 0;
      return this.habits.filter(h => this.isHabitDone(h.id)).length;
    },
    get dailyCompletionPct() {
      if (!this.habits.length) return 0;
      return Math.round((this.completedTodayCount / this.habits.length) * 100);
    },
    get stageTitle() {
      const pct = this.dailyCompletionPct;
      if (pct === 100) return "GigaChad Supremo";
      if (pct >= 80) return "Bloomer Ascendente";
      if (pct >= 50) return "Wojak em Combate";
      if (pct >= 20) return "Soyjak em Risco";
      return "Doomer Inicial";
    },
    get stageEmoji() {
      const pct = this.dailyCompletionPct;
      if (pct === 100) return "🗿";
      if (pct >= 80) return "🌸";
      if (pct >= 50) return "⚔️";
      if (pct >= 20) return "⚠️";
      return "💀";
    },

    get dayTodos() {
      const cur = this.selectedDateStr;
      return this.todos.filter(t => t.due_date === cur);
    },
    get dayTodosPending() {
      return this.dayTodos.filter(t => !t.completed).length;
    },
    get dayTodosCompleted() {
      return this.dayTodos.filter(t => t.completed).length;
    },

    init() {
      const saved = localStorage.getItem('forge_completions');
      if (saved) {
        try { this.completions = JSON.parse(saved); } catch(e) {}
      }
      this.loadTodos();
      this.loadJournal();
      if (window.lucide) window.lucide.createIcons();
    },

    prevDay() {
      this.currentDate = new Date(this.currentDate.setDate(this.currentDate.getDate() - 1));
      this.loadJournal();
      this.$nextTick(() => { if (window.lucide) window.lucide.createIcons(); });
    },
    nextDay() {
      this.currentDate = new Date(this.currentDate.setDate(this.currentDate.getDate() + 1));
      this.loadJournal();
      this.$nextTick(() => { if (window.lucide) window.lucide.createIcons(); });
    },
    goToToday() {
      this.currentDate = new Date();
      this.loadJournal();
      this.$nextTick(() => { if (window.lucide) window.lucide.createIcons(); });
    },

    isHabitDone(habitId) {
      return !!this.completions[`${habitId}_${this.selectedDateStr}`];
    },
    toggleHabitToday(habitId) {
      const key = `${habitId}_${this.selectedDateStr}`;
      const next = { ...this.completions };
      if (next[key]) delete next[key];
      else next[key] = true;
      this.completions = next;
      localStorage.setItem('forge_completions', JSON.stringify(this.completions));
      this.$nextTick(() => { if (window.lucide) window.lucide.createIcons(); });
    },

    getStreak(habitId) {
      let streak = 0;
      let cursor = new Date(this.currentDate);
      const fmt = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dayNum = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dayNum}`;
      };
      const curStr = fmt(cursor);
      if (!this.completions[`${habitId}_${curStr}`]) {
        cursor.setDate(cursor.getDate() - 1);
      }
      while (this.completions[`${habitId}_${fmt(cursor)}`]) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    },

    async loadTodos() {
      try {
        const res = await fetch('/api/todos');
        if (res.ok) {
          const data = await res.json();
          this.todos = Array.isArray(data) ? data : [];
        }
      } catch(e) {
        // Fallback local
        const local = localStorage.getItem('forge_todos_v1');
        if (local) {
          try { this.todos = JSON.parse(local); } catch(err) {}
        }
      }
      this.$nextTick(() => { if (window.lucide) window.lucide.createIcons(); });
    },

    async addQuickTodo() {
      if (!this.quickTodoTitle.trim()) return;
      const title = this.quickTodoTitle.trim();
      const payload = {
        title: title,
        due_date: this.selectedDateStr,
        color: '#818cf8'
      };
      this.quickTodoTitle = '';
      try {
        const res = await fetch('/api/todos', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const created = await res.json();
          this.todos = [created, ...this.todos];
        }
      } catch(e) {
        // local
        this.todos = [{ id: 'local_' + Date.now(), title, due_date: this.selectedDateStr, completed: false }, ...this.todos];
      }
      this.$nextTick(() => { if (window.lucide) window.lucide.createIcons(); });
    },

    async toggleTodoItem(id) {
      const idx = this.todos.findIndex(t => t.id === id);
      if (idx === -1) return;
      const nextCompleted = !this.todos[idx].completed;
      this.todos[idx].completed = nextCompleted;
      try {
        await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ completed: nextCompleted })
        });
      } catch(e) {}
      this.$nextTick(() => { if (window.lucide) window.lucide.createIcons(); });
    },

    loadJournal() {
      try {
        const raw = localStorage.getItem('forge_journal_v1');
        if (raw) {
          const map = JSON.parse(raw);
          const entry = map[this.selectedDateStr];
          if (entry) {
            this.journalWin = entry.winOfTheDay || '';
            this.journalExcuse = entry.betoExcuseDestroyed || '';
            this.journalContent = entry.content || '';
          } else {
            this.journalWin = '';
            this.journalExcuse = '';
            this.journalContent = '';
          }
        }
      } catch(e) {}
    },

    saveDailyJournal() {
      try {
        const raw = localStorage.getItem('forge_journal_v1');
        const map = raw ? JSON.parse(raw) : {};
        map[this.selectedDateStr] = {
          date: this.selectedDateStr,
          winOfTheDay: this.journalWin,
          betoExcuseDestroyed: this.journalExcuse,
          content: this.journalContent,
          completionSnapshot: this.dailyCompletionPct,
          stageSnapshot: this.stageTitle.toLowerCase(),
          updatedAt: new Date().toISOString()
        };
        localStorage.setItem('forge_journal_v1', JSON.stringify(map));
        this.journalSaved = true;
        setTimeout(() => this.journalSaved = false, 2500);
      } catch(e) {
        alert('Erro ao salvar diário: ' + e.message);
      }
    }
  }));
});
</script>
{% endblock %}
